<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BLACKLINE 일정관리</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--tx:#16181c;--mu:#6b7078;--bd:#dcdcd8;--ac:#111;--acx:#fff;--ok:#1e8a4c;--okbg:#e2f3e8;--no:#c2412d;--nobg:#fbe6e1;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f11;--card:#18191c;--tx:#ececec;--mu:#92979f;--bd:#2c2e33;--ac:#f2f2f2;--acx:#111;--ok:#5fd18a;--okbg:#14301f;--no:#ff8a73;--nobg:#3a1c16;--warn:#e6b450;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.logo{font-weight:800;letter-spacing:.18em;font-size:16px;margin-right:6px}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px}
button.pri,button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.dng{color:var(--no)}
button:disabled{opacity:.5;cursor:default}
h2{margin:0;font-size:18px;min-width:120px;text-align:center}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;max-width:1300px;margin:auto}
.alert{max-width:1272px;margin:10px auto 0;padding:10px 14px;border-radius:10px;background:var(--nobg);color:var(--no);font-weight:600;cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px;max-width:1300px;margin:10px auto 0}
.st{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.st small{color:var(--mu);display:block}.st b{font-size:18px}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
.pad{padding:14px}
.grid{display:block;min-width:660px}
.hdr{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr))}
.dow{padding:8px;text-align:center;color:var(--mu);font-size:12px;border-bottom:1px solid var(--bd)}
/* 한 주 = 한 행(row). 배경 날짜 칸 7개 위에 주간 이벤트 레이어를 겹쳐 놓는다. */
.wk{position:relative;display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-height:104px}
.day{min-height:104px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:4px;cursor:pointer;overflow:hidden}
.wk>.day:nth-child(7){border-right:0}.day.out{opacity:.4}.day.sel{outline:2px solid var(--ac);outline-offset:-2px}
.dn{font-size:12px;color:var(--mu);margin-bottom:3px}
.day.today .dn{color:var(--acx);background:var(--ac);display:inline-block;border-radius:10px;padding:0 6px}
/* 주간 이벤트 레이어 — 7열 그리드 위에 절대 배치. 막대는 grid-column:시작/span 길이로
   칸 경계선을 가로질러 이어진다. 빈 곳 클릭은 아래 날짜 칸으로 통과시킨다. */
.layer{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));grid-auto-rows:20px;row-gap:2px;align-content:start;padding:22px 0 0;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:4px;height:20px;margin:0 3px 0 0;padding:0 6px;border:0;border-radius:5px;background:var(--nobg);color:var(--tx);font-size:11px;line-height:1;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;cursor:pointer}
.bar.one{border-left:3px solid var(--no);padding-left:4px}
.bar.paid{background:var(--okbg);border-left-color:var(--ok)}
.bar.md{background:var(--ac);color:var(--acx);border-left:0;font-weight:600}
.bar.md.paid{background:var(--ok);color:var(--acx)}
/* 주를 넘어 이어지는 막대: 잘린 쪽 모서리를 각지게 */
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar .br{flex:none;font-weight:800;opacity:.92}
.bar .bs{flex:none;opacity:.75}
.bar .bt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mu);padding-left:5px;pointer-events:auto;cursor:pointer}
.side h3{margin:0 0 10px;font-size:15px}
.ev{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.row{color:var(--mu);font-size:12.5px;margin-top:3px}.row span{color:var(--tx)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--nobg);color:var(--no);white-space:nowrap}
.badge.paid{background:var(--okbg);color:var(--ok)}
.warn{color:var(--warn);font-size:12px;margin-top:5px;font-weight:600}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px}
.sch td,.sch th{text-align:center;padding:5px 3px;min-width:26px;font-size:12px}
.sch td:first-child,.sch th:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:80px;padding-left:10px}
.sch td.has{background:var(--ac);color:var(--acx);font-weight:700;cursor:pointer}
.sch td.bad{background:var(--no);color:#fff}
.od{color:var(--no);font-weight:700}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:12px;color:var(--mu);margin:9px 0 3px}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:14px}.chk input{width:auto}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9;padding:20px}
#lock input{width:230px;text-align:center;font-size:18px;letter-spacing:.14em}
#lock .chk{margin-top:0;font-size:13px;color:var(--mu);justify-content:center}
#lock .chk input{width:auto;font-size:14px;letter-spacing:normal}
.note{color:var(--mu);font-size:12px;padding:0 14px 20px;max-width:1300px;margin:auto}
/* 서버 동기화 상태 */
.sync{font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;white-space:nowrap}
.sync.ok{color:var(--ok);border-color:var(--ok)}
.sync.err{color:var(--no);border-color:var(--no)}
.sync.busy{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.ok{background:var(--ok);color:#fff}
#toast[hidden]{display:none}
</style>
</head>
<body>
<div id="lock">
  <div class="logo" style="font-size:22px">BLACKLINE</div>
  <div id="lt" class="row">팀 비밀번호를 입력하세요</div>
  <input id="pin" type="password" maxlength="64" autocomplete="current-password" placeholder="팀 비밀번호">
  <label class="chk" id="keeprow"><input type="checkbox" id="keep"> 이 기기에서 로그인 유지</label>
  <button class="pri" id="lb">확인</button>
  <div id="lmsg" class="row" style="max-width:340px;text-align:center;line-height:1.5"></div>
</div>

<header>
  <span class="logo">BLACKLINE</span>
  <button data-t="cal" class="tab on">달력</button>
  <button data-t="sch" class="tab">인원별 근무표</button>
  <button data-t="unp" class="tab">미수금</button>
  <button data-t="sta" class="tab">인원 집계</button>
  <span class="sp"></span>
  <span id="sync" class="sync busy">연결 중</span>
  <button id="rf">새로고침</button>
  <button id="lk">잠금</button>
  <button id="csv">엑셀 내보내기</button>
  <button id="bak">백업</button>
  <button id="rst">복원</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="pri" id="add">+ 새 일정</button>
</header>
<div id="alert" class="alert" hidden></div>
<div class="bar" id="mbar"><button id="prev">◀</button><h2 id="ttl"></h2><button id="next">▶</button><button id="tdy">오늘</button></div>
<div class="stats" id="stats"></div>
<div id="v_cal" class="wrap"><div class="box"><div class="grid" id="grid"></div></div><aside class="box pad side" style="align-self:start"><h3 id="sdt"></h3><div id="list"></div></aside></div>
<div id="v_sch" class="wrap" style="display:none;grid-template-columns:1fr"><div class="box"><table class="sch" id="schT"></table></div></div>
<div id="v_unp" class="wrap" style="display:none;grid-template-columns:1fr"><div class="box"><table id="unpT"></table></div></div>
<div id="v_sta" class="wrap" style="display:none;grid-template-columns:1fr"><div class="box"><table id="staT"></table></div></div>
<div class="note">데이터는 서버에 안전하게 저장되어 접속한 모든 팀원과 실시간으로 공유됩니다. 다른 곳에 보관하려면 ‘백업’으로 파일을 저장하세요.</div>
<div id="toast" hidden></div>

<dialog id="dlg">
  <h3 id="dh" style="margin:0 0 4px">일정</h3>
  <label>일정 제목</label><input id="f_title" placeholder="예: VIP 행사 근접경호">
  <div class="two"><div><label>시작일</label><input id="f_date" type="date"></div><div><label>종료일 (여러 날)</label><input id="f_end_date" type="date"></div></div>
  <div class="row" style="margin:-2px 0 2px">종료일을 비우거나 시작일과 같게 두면 하루 일정입니다.</div>
  <div class="two"><div><label>시작 시간</label><input id="f_start" type="time"></div><div><label>종료 시간</label><input id="f_end" type="time"></div></div>
  <label>의뢰인</label><input id="f_client">
  <label>장소</label><input id="f_place">
  <label>투입 인원 (쉼표로 구분)</label><input id="f_staff" placeholder="김철수, 이영호, 박민수">
  <div class="two"><div><label>금액 (원)</label><input id="f_amount" type="number" inputmode="numeric" min="0"></div><div><label>입금 기한</label><input id="f_due" type="date"></div></div>
  <label class="chk"><input type="checkbox" id="f_paid"> 입금 완료</label>
  <label>메모</label><textarea id="f_memo" rows="3"></textarea>
  <div class="acts" style="margin-top:14px"><button class="pri" id="save">저장</button><button id="cancel">취소</button><span class="sp"></span><button class="dng" id="del">삭제</button></div>
</dialog>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var pad=function(n){return n<10?"0"+n:""+n};
var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var won=function(n){return (Number(n)||0).toLocaleString("ko-KR")+"원"};
var clock=function(d){d=d||new Date();return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())};
var today=ymd(new Date()),cur=new Date();cur.setDate(1);
var sel=today,tab="cal",editId=null;

/* =======================================================================
 * 서버 설정
 *  - Cloudflare Worker를 배포한 뒤 아래 API_BASE에 주소를 넣으면 연결됩니다.
 *    예: var API_BASE = "https://blackline-api.<계정>.workers.dev";
 *  - 로컬 테스트: 주소 뒤에 ?api=http://127.0.0.1:8787 처럼 붙이면 덮어씁니다.
 * ======================================================================= */
var API_BASE = "https://blackline-api.starha2015.workers.dev";
var SYNC_MS = 10000; // 자동 동기화 주기(10초)
try{var _q=new URLSearchParams(location.search).get("api");if(_q)API_BASE=_q}catch(e){}
if(window.BLACKLINE_API)API_BASE=window.BLACKLINE_API;
API_BASE=String(API_BASE||"").replace(/\/+$/,"");
var TOK_S="bl_tok",TOK_K="bl_tok_keep";

var events=[];               /* 서버(D1)의 최신 일정 목록 */
var syncing=false,syncErr=0,syncOkAt=null,seq=0,timer=null;

/* ---------- 토큰 ---------- */
function token(){try{return sessionStorage.getItem(TOK_S)||localStorage.getItem(TOK_K)||""}catch(e){return ""}}
function setToken(t,keep){try{sessionStorage.setItem(TOK_S,t);if(keep)localStorage.setItem(TOK_K,t);else localStorage.removeItem(TOK_K)}catch(e){}}
function clearToken(){try{sessionStorage.removeItem(TOK_S);localStorage.removeItem(TOK_K)}catch(e){}}

/* ---------- API 호출 ---------- */
function apiErr(code,msg){var e=new Error(msg);e.code=code;return e}
function api(path,opt){
  opt=opt||{};
  if(!API_BASE)return Promise.reject(apiErr("no_api","서버 주소가 설정되지 않았습니다."));
  var h={"Content-Type":"application/json"};
  var t=token();if(t)h["Authorization"]="Bearer "+t;
  return fetch(API_BASE+path,{method:opt.method||"GET",headers:h,body:(opt.body===undefined?undefined:JSON.stringify(opt.body)),cache:"no-store",credentials:"omit"})
    .then(function(r){
      return r.text().then(function(tx){
        var j=null;try{j=tx?JSON.parse(tx):{}}catch(e){}
        if(r.ok){if(!j)throw apiErr("bad_response","서버 응답을 읽지 못했습니다.");return j}
        var e=apiErr("http_"+r.status,(j&&(j.error||j.message))||("서버 오류 ("+r.status+")"));
        e.status=r.status;e.serverCode=j&&j.code;throw e;
      })
    },function(){throw apiErr("network","서버에 연결하지 못했습니다.")});
}

/* ---------- 상태 표시 ---------- */
function setSync(kind,msg){var el=$("sync");if(!el)return;el.className="sync "+kind;el.textContent=msg}
function toast(msg,ok){var t=$("toast");t.textContent=msg;t.className=ok?"ok":"";t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}
function failMsg(e){
  if(!e)return "알 수 없는 오류입니다.";
  if(e.code==="no_api")return "서버 주소가 설정되지 않았습니다.";
  if(e.code==="network")return "서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.";
  return e.message||"서버와 통신하지 못했습니다.";
}

/* ---------- 로그인 화면 ---------- */
function showLock(msg){
  stopSync();
  $("lock").style.display="flex";
  $("lt").textContent=msg||"팀 비밀번호를 입력하세요";
  $("pin").value="";
  setTimeout(function(){try{$("pin").focus()}catch(e){}},50);
}
function lockNow(msg){
  clearToken();stopSync();events=[];render();
  showLock(msg||"잠겼습니다. 다시 로그인해 주세요.");
}
function doLogin(){
  if(!API_BASE)return;
  var pw=$("pin").value;
  if(!pw){$("lmsg").textContent="비밀번호를 입력하세요.";return}
  $("lb").disabled=true;$("lt").textContent="확인 중…";$("lmsg").textContent="";
  api("/api/login",{method:"POST",body:{password:pw}}).then(function(d){
    if(!d||!d.token)throw apiErr("no_token","로그인 응답이 올바르지 않습니다.");
    setToken(d.token,$("keep").checked);
    $("lt").textContent="팀 비밀번호를 입력하세요";$("lmsg").textContent="";
    enter();
  }).catch(function(e){
    $("lt").textContent="팀 비밀번호를 입력하세요";
    $("lmsg").textContent=(e&&e.status===401)?"비밀번호가 맞지 않습니다.":failMsg(e);
    $("pin").value="";
  }).then(function(){$("lb").disabled=false});
}
function enter(){
  $("lock").style.display="none";
  $("pin").value="";$("lmsg").textContent="";
  startSync();
  pull(true);
}
function boot(){
  if(!API_BASE){
    showLock("서버 연결이 아직 설정되지 않았습니다");
    $("pin").style.display="none";$("keeprow").style.display="none";$("lb").style.display="none";
    $("lmsg").textContent="관리자가 서버(Cloudflare Worker) 주소를 연결하면 이 화면에서 팀 비밀번호로 로그인할 수 있습니다.";
    setSync("err","서버 미연결");
    return;
  }
  var t=token();
  if(!t){showLock("팀 비밀번호를 입력하세요");return}
  $("lt").textContent="로그인 확인 중…";$("lmsg").textContent="";
  api("/api/verify").then(function(){enter()}).catch(function(e){
    if(e&&e.status===401){clearToken();showLock("세션이 만료되었습니다. 다시 로그인해 주세요.")}
    else{$("lt").textContent="팀 비밀번호를 입력하세요";$("lmsg").textContent=failMsg(e)}
  });
}

/* ---------- 자동 동기화 ---------- */
function startSync(){stopSync();timer=setInterval(function(){pull(false)},SYNC_MS)}
function stopSync(){if(timer){clearInterval(timer);timer=null}}
function pull(force){
  if(!API_BASE||!token()||syncing)return;
  if(!force){
    if($("dlg").open)return;      /* 수정 중에는 서버 응답으로 덮어쓰지 않음 */
    if(document.hidden)return;
  }
  syncing=true;var my=seq;
  if(force)setSync("busy","불러오는 중…");
  api("/api/events").then(function(d){
    syncing=false;
    if(my!==seq)return;           /* 조회 중 저장이 있었으면 결과 무시 */
    var list=(d&&d.events)||[];
    if(JSON.stringify(list)!==JSON.stringify(events)){events=list;render()}
    syncErr=0;syncOkAt=new Date();
    setSync("ok","동기화 "+clock(syncOkAt));
  }).catch(function(e){
    syncing=false;
    if(e&&e.status===401){lockNow("세션이 만료되었습니다. 다시 로그인해 주세요.");return}
    syncErr++;
    setSync("err",syncErr>1?("연결 오류 · "+syncErr+"회"):"연결 오류 · 재시도 중");
  });
}

/* ---------- 공용 계산 ---------- */
function staffOf(e){return (e.staff||"").split(",").map(function(s){return s.trim()}).filter(Boolean)}
function endOf(e){var en=(e&&e.endDate)||"";return en&&en>=e.date?en:e.date}
function isMulti(e){return endOf(e)!==e.date}
function addDays(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5)}
function daysOf(e){return daysBetween(e.date,endOf(e))+1}
function covers(e,d){return e.date<=d&&d<=endOf(e)}
function rangeLabel(e){return isMulti(e)?e.date+" ~ "+endOf(e):e.date}
function shortRange(e){var a=e.date,b=endOf(e);var am=String(+a.slice(5,7))+"/"+String(+a.slice(8)),bm=String(+b.slice(5,7))+"/"+String(+b.slice(8));return a.slice(0,7)===b.slice(0,7)?am+"~"+String(+b.slice(8)):am+"~"+bm}
function overlap(a,b){var as=a.start||"00:00",ae=a.end||"23:59",bs=b.start||"00:00",be=b.end||"23:59";return as<be&&bs<ae}
function conflictsOn(e,d){var out=[];events.forEach(function(o){if(o.id===e.id||!covers(o,d)||!covers(e,d)||!overlap(e,o))return;var s=staffOf(o);staffOf(e).forEach(function(n){if(s.indexOf(n)>-1&&out.indexOf(n)<0)out.push(n)})});return out}
function conflicts(e){var out=[];for(var k=e.date;k<=endOf(e);k=addDays(k,1)){conflictsOn(e,k).forEach(function(n){if(out.indexOf(n)<0)out.push(n)})}return out}
function byDay(d){return events.filter(function(e){return covers(e,d)}).sort(function(a,b){return (a.start||"").localeCompare(b.start||"")||String(a.title).localeCompare(String(b.title))})}
function hours(e){if(!e.start||!e.end)return 0;var a=e.start.split(":"),b=e.end.split(":");var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(m<0)m+=1440;return m/60}
function monthBounds(){var y=cur.getFullYear(),m=cur.getMonth();return [y+"-"+pad(m+1)+"-01",y+"-"+pad(m+1)+"-"+pad(new Date(y,m+1,0).getDate())]}
function monthEv(){var b=monthBounds();return events.filter(function(e){return e.date<=b[1]&&endOf(e)>=b[0]})}
function isOver(e){return !e.paid&&e.due&&e.due<today}
function soon(e){if(e.paid||!e.due||e.due<today)return false;return (new Date(e.due)-new Date(today))/864e5<=3}

function render(){
  $("ttl").textContent=cur.getFullYear()+"년 "+(cur.getMonth()+1)+"월";
  ["cal","sch","unp","sta"].forEach(function(t){$("v_"+t).style.display=t===tab?"grid":"none"});
  $("mbar").style.display=(tab==="unp")?"none":"flex";
  document.querySelectorAll(".tab").forEach(function(b){b.className="tab"+(b.dataset.t===tab?" on":"")});
  var od=events.filter(isOver),sn=events.filter(soon);
  var a=$("alert");a.hidden=!(od.length||sn.length);
  a.textContent="⚠ 입금 기한 초과 "+od.length+"건 · 3일 내 만료 "+sn.length+"건 (눌러서 미수금 보기)";
  var ms=monthEv(),tot=0,paid=0,unp=0,unc=0;
  ms.forEach(function(e){var n=Number(e.amount)||0;tot+=n;if(e.paid)paid+=n;else{unp+=n;unc++}});
  $("stats").innerHTML='<div class="st"><small>이번 달 일정</small><b>'+ms.length+'건</b></div><div class="st"><small>총 금액</small><b>'+won(tot)+'</b></div><div class="st"><small>입금 완료</small><b style="color:var(--ok)">'+won(paid)+'</b></div><div class="st"><small>미입금 ('+unc+'건)</small><b style="color:var(--no)">'+won(unp)+'</b></div>';
  if(tab==="cal")rCal();else if(tab==="sch")rSch();else if(tab==="unp")rUnp();else rSta();
}

/* 한 주(7칸) 안에서 여러 날 일정이 같은 높이(레인)에 놓이도록 배치한다. */
function weekLayout(days){
  var items=[];
  events.forEach(function(e){
    var c0=-1,c1=-1;
    for(var i=0;i<7;i++)if(covers(e,days[i])){if(c0<0)c0=i;c1=i}
    if(c0<0)return;
    items.push({e:e,c0:c0,c1:c1,lane:0});
  });
  items.sort(function(a,b){return a.c0-b.c0||(b.c1-b.c0)-(a.c1-a.c0)||(a.e.start||"").localeCompare(b.e.start||"")||String(a.e.title).localeCompare(String(b.e.title))});
  var lanes=[];
  items.forEach(function(it){
    var li=0;
    while(lanes[li]&&lanes[li].some(function(o){return !(it.c1<o.c0||o.c1<it.c0)}))li++;
    (lanes[li]||(lanes[li]=[])).push(it);
    it.lane=li;
  });
  return items;
}
var MAXLANE=4;   /* 한 주에 위아래로 쌓아 보여줄 최대 줄 수 */
function barLabel(e,days,contL){
  var h="";
  if(isMulti(e))h+='<span class="br">'+(contL?"↳ ":esc(shortRange(e)))+"</span>";
  else if(e.start)h+='<span class="bs">'+esc(e.start)+"</span>";
  h+='<span class="bt">'+esc(e.title)+"</span>";
  return h;
}
function rCal(){
  var y=cur.getFullYear(),m=cur.getMonth(),g=$("grid");g.innerHTML="";
  var hd=document.createElement("div");hd.className="hdr";
  ["일","월","화","수","목","금","토"].forEach(function(n){var d=document.createElement("div");d.className="dow";d.textContent=n;hd.appendChild(d)});
  g.appendChild(hd);
  var st=new Date(y,m,1-new Date(y,m,1).getDay()),weeks=[];
  for(var w=0;w<6;w++){
    var days=[];
    for(var i=0;i<7;i++)days.push(ymd(new Date(st.getFullYear(),st.getMonth(),st.getDate()+w*7+i)));
    if(!days.some(function(k){return new Date(k+"T00:00:00").getMonth()===m}))continue;
    weeks.push(days);
  }
  weeks.forEach(function(days){
    var items=weekLayout(days),maxLane=-1;
    items.forEach(function(it){if(it.lane>maxLane)maxLane=it.lane});
    var laneCount=Math.min(MAXLANE,maxLane+1);
    var extra=[0,0,0,0,0,0,0];
    items.forEach(function(it){if(it.lane<laneCount)return;for(var i=it.c0;i<=it.c1;i++)extra[i]++});
    var anyExtra=extra.some(function(v){return v>0});
    var wk=document.createElement("div");wk.className="wk";
    wk.style.minHeight=Math.max(104,22+laneCount*22+(anyExtra?20:0))+"px";
    days.forEach(function(k){
      var d=new Date(k+"T00:00:00"),c=document.createElement("div");
      c.className="day"+(d.getMonth()!==m?" out":"")+(k===today?" today":"")+(k===sel?" sel":"");
      c.dataset.d=k;
      c.innerHTML='<div class="dn">'+d.getDate()+"</div>";
      wk.appendChild(c);
    });
    var lay=document.createElement("div");lay.className="layer";
    items.forEach(function(it){
      if(it.lane>=laneCount)return;
      var e=it.e,md=isMulti(e),contL=e.date<days[0],contR=endOf(e)>days[6];
      var b=document.createElement("button");b.type="button";
      b.className="bar"+(md?" md":" one")+(e.paid?" paid":"")+(contL?" cl":"")+(contR?" cr":"");
      b.style.gridColumn=(it.c0+1)+" / span "+(it.c1-it.c0+1);
      b.style.gridRow=String(it.lane+1);
      b.dataset.id=e.id;b.dataset.day=days[it.c0];
      b.title=(md?shortRange(e)+" ":(e.start?e.start+" ":""))+e.title+(md?" · "+rangeLabel(e)+" ("+daysOf(e)+"일)":"");
      b.innerHTML=barLabel(e,days,contL);
      lay.appendChild(b);
    });
    extra.forEach(function(n,ci){
      if(!n)return;
      var s=document.createElement("div");s.className="more";
      s.style.gridColumn=String(ci+1);s.style.gridRow=String(laneCount+1);
      s.dataset.d=days[ci];s.textContent="+"+n+"건 더";lay.appendChild(s);
    });
    wk.appendChild(lay);g.appendChild(wk);
  });
  var p=sel.split("-");$("sdt").textContent=p[0]+"년 "+Number(p[1])+"월 "+Number(p[2])+"일 일정";
  var list=byDay(sel),h="";
  if(!list.length)h='<div class="row">등록된 일정이 없습니다.</div>';
  list.forEach(function(e){
    var cf=conflicts(e);
    h+='<div class="ev"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(e.title)+'</b><span class="badge'+(e.paid?" paid":"")+'">'+(e.paid?"입금완료":"미입금")+'</span></div>'
    +(isMulti(e)?'<div class="row">기간 <span>'+esc(rangeLabel(e))+'</span> ('+daysOf(e)+'일 중 '+(daysBetween(e.date,sel)+1)+'일차)</div>':"")
    +'<div class="row">시간 <span>'+esc(e.start||"-")+" ~ "+esc(e.end||"-")+'</span></div>'
    +'<div class="row">장소 <span>'+esc(e.place||"-")+'</span></div>'
    +'<div class="row">의뢰인 <span>'+esc(e.client||"-")+'</span></div>'
    +'<div class="row">투입 <span>'+(esc(staffOf(e).join(", "))||"-")+'</span> ('+staffOf(e).length+'명)</div>'
    +'<div class="row">금액 <span>'+won(e.amount)+'</span>'+(e.due&&!e.paid?' · 기한 <span class="'+(isOver(e)?"od":"")+'">'+esc(e.due)+'</span>':"")+'</div>'
    +(e.memo?'<div class="row">메모 <span>'+esc(e.memo).replace(/\n/g,"<br>")+'</span></div>':"")
    +(cf.length?'<div class="warn">⚠ 시간 중복 배정: '+esc(cf.join(", "))+'</div>':"")
    +'<div class="acts"><button data-pay="'+esc(e.id)+'">'+(e.paid?"입금 취소":"입금 완료 처리")+'</button><button data-edit="'+esc(e.id)+'">수정</button></div></div>';
  });
  $("list").innerHTML=h;
}

function rSch(){
  var y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),ms=monthEv(),names=[];
  ms.forEach(function(e){staffOf(e).forEach(function(s){if(names.indexOf(s)<0)names.push(s)})});names.sort();
  var h='<tr><th>인원</th>';for(var d=1;d<=n;d++)h+='<th>'+d+'</th>';h+='</tr>';
  if(!names.length)h+='<tr><td colspan="'+(n+1)+'">이번 달 배정된 인원이 없습니다.</td></tr>';
  names.forEach(function(nm){
    h+='<tr><td>'+esc(nm)+'</td>';
    for(var d=1;d<=n;d++){
      var k=y+"-"+pad(m+1)+"-"+pad(d),l=ms.filter(function(e){return covers(e,k)&&staffOf(e).indexOf(nm)>-1});
      var bad=l.some(function(e){return conflictsOn(e,k).indexOf(nm)>-1});
      h+='<td class="'+(l.length?"has":"")+(bad?" bad":"")+'" data-d="'+k+'" title="'+esc(l.map(function(e){return (e.start||"")+" "+e.title}).join(" / "))+'">'+(l.length||"")+'</td>';
    }
    h+='</tr>';
  });
  $("schT").innerHTML=h;
}

function rUnp(){
  var l=events.filter(function(e){return !e.paid}).sort(function(a,b){return (a.due||a.date).localeCompare(b.due||b.date)}),tot=0;
  var h='<tr><th>상태</th><th>일정</th><th>의뢰인</th><th>일정일</th><th>입금 기한</th><th>금액</th><th></th></tr>';
  l.forEach(function(e){tot+=Number(e.amount)||0;
    h+='<tr><td>'+(isOver(e)?'<span class="badge">기한초과</span>':soon(e)?'<span class="badge" style="color:var(--warn)">임박</span>':'<span class="badge">미입금</span>')+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.client||"-")+'</td><td>'+esc(isMulti(e)?shortRange(e):e.date)+(isMulti(e)?' <span style="color:var(--mu)">('+daysOf(e)+'일)</span>':"")+'</td><td class="'+(isOver(e)?"od":"")+'">'+esc(e.due||"-")+'</td><td>'+won(e.amount)+'</td><td><button data-pay="'+esc(e.id)+'">입금 완료</button></td></tr>';});
  h+=l.length?'<tr><td colspan="5"><b>미수금 합계 ('+l.length+'건)</b></td><td colspan="2"><b>'+won(tot)+'</b></td></tr>':'<tr><td colspan="7">미수금이 없습니다.</td></tr>';
  $("unpT").innerHTML=h;
}

function rSta(){
  var mb=monthBounds(),map={};
  monthEv().forEach(function(e){
    var names=staffOf(e);
    if(!names.length)return;
    var from=e.date>mb[0]?e.date:mb[0],to=endOf(e)<mb[1]?endOf(e):mb[1],days=[];
    for(var k=from;k<=to;k=addDays(k,1))days.push(k);
    names.forEach(function(s){var o=map[s]||(map[s]={c:0,h:0,d:{}});o.c++;days.forEach(function(k){o.d[k]=1;o.h+=hours(e)})});
  });
  var names=Object.keys(map).sort(function(a,b){return map[b].c-map[a].c});
  var h='<tr><th>인원</th><th>투입 건수</th><th>근무일수</th><th>총 시간</th></tr>';
  names.forEach(function(n){h+='<tr><td>'+esc(n)+'</td><td>'+map[n].c+'건</td><td>'+Object.keys(map[n].d).length+'일</td><td>'+(Math.round(map[n].h*10)/10)+'시간</td></tr>'});
  if(!names.length)h+='<tr><td colspan="4">이번 달 집계할 데이터가 없습니다.</td></tr>';
  $("staT").innerHTML=h;
}

/* ---------- 등록·수정 ---------- */
function openForm(id,date){
  editId=id;var e=events.filter(function(x){return x.id===id})[0]||{};
  $("dh").textContent=id?"일정 수정":"새 일정";
  $("f_title").value=e.title||"";$("f_date").value=e.date||date||sel;$("f_end_date").value=(e.endDate&&e.endDate>e.date)?e.endDate:"";$("f_client").value=e.client||"";
  $("f_start").value=e.start||"";$("f_end").value=e.end||"";$("f_place").value=e.place||"";$("f_staff").value=e.staff||"";
  $("f_amount").value=e.amount||"";$("f_due").value=e.due||"";$("f_paid").checked=!!e.paid;$("f_memo").value=e.memo||"";
  $("del").style.display=id?"":"none";$("dlg").showModal();
}
function applyEvent(ev){
  if(!ev)return;
  var i=-1;for(var k=0;k<events.length;k++)if(events[k].id===ev.id){i=k;break}
  if(i>-1)events[i]=ev;else events.push(ev);
  render();
}
$("save").onclick=function(){
  if(!$("f_title").value.trim()||!$("f_date").value){alert("제목과 날짜를 입력하세요.");return}
  var sdt=$("f_date").value,edt=$("f_end_date").value;
  if(edt&&edt<sdt){alert("종료일은 시작일보다 빠를 수 없습니다.");return}
  var o={id:editId||("e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),title:$("f_title").value.trim(),date:sdt,endDate:(edt&&edt>sdt)?edt:"",client:$("f_client").value.trim(),start:$("f_start").value,end:$("f_end").value,place:$("f_place").value.trim(),staff:$("f_staff").value.trim(),amount:Number($("f_amount").value)||0,due:$("f_due").value,paid:$("f_paid").checked,memo:$("f_memo").value.trim()};
  var btn=this;btn.disabled=true;setSync("busy","저장 중…");seq++;
  api("/api/events",{method:"POST",body:{event:o}}).then(function(d){
    sel=o.date;var p=o.date.split("-");cur=new Date(+p[0],+p[1]-1,1);
    $("dlg").close();applyEvent(d.event);
    setSync("ok","저장됨 "+clock());
  }).catch(function(e){
    setSync("err","저장 실패");
    if(!(e&&e.status===401))alert("서버에 저장하지 못했습니다.\n"+failMsg(e));else lockNow("세션이 만료되었습니다. 다시 로그인해 주세요.");
  }).then(function(){btn.disabled=false;});
};
$("cancel").onclick=function(){$("dlg").close()};
$("del").onclick=function(){
  if(!editId)return;
  if(!confirm("이 일정을 삭제할까요?"))return;
  var id=editId;seq++;setSync("busy","삭제 중…");
  api("/api/events/"+encodeURIComponent(id),{method:"DELETE"}).then(function(){
    events=events.filter(function(x){return x.id!==id});
    $("dlg").close();render();setSync("ok","삭제됨 "+clock());
  }).catch(function(e){
    setSync("err","삭제 실패");
    if(!(e&&e.status===401))alert("삭제하지 못했습니다.\n"+failMsg(e));else lockNow("세션이 만료되었습니다. 다시 로그인해 주세요.");
  });
};
$("add").onclick=function(){openForm(null,sel)};
$("f_date").onchange=function(){var s=this.value,en=$("f_end_date");if(s&&(!en.value||en.value<s))en.value=s};
$("prev").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("next").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$("tdy").onclick=function(){var n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);sel=today;render()};
$("alert").onclick=function(){tab="unp";render()};
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
$("rf").onclick=function(){pull(true)};
$("lk").onclick=function(){lockNow("잠겼습니다. 다시 로그인해 주세요.")};

function pay(id){
  seq++;setSync("busy","저장 중…");
  api("/api/events/"+encodeURIComponent(id)+"/pay",{method:"PATCH",body:{}}).then(function(d){
    applyEvent(d.event);setSync("ok","저장됨 "+clock());
  }).catch(function(e){
    setSync("err","저장 실패");
    if(e&&e.status===401)lockNow("세션이 만료되었습니다. 다시 로그인해 주세요.");
    else alert("입금 상태를 바꾸지 못했습니다.\n"+failMsg(e));
  });
}
document.body.addEventListener("click",function(ev){
  var t=ev.target,p=t.getAttribute&&t.getAttribute("data-pay"),e=t.getAttribute&&t.getAttribute("data-edit");
  if(p){pay(p);return}if(e){openForm(e);return}
  var bar=t.closest(".bar"),more=t.closest(".more"),day=t.closest(".day"),sc=t.closest("td.has");
  if(sc){sel=sc.dataset.d;tab="cal";render();return}
  if(bar){if(bar.dataset.day)sel=bar.dataset.day;render();openForm(bar.dataset.id);return}
  if(more){sel=more.dataset.d;render();return}
  if(day){sel=day.dataset.d;render()}
});

/* ---------- 내보내기·백업·복원 ---------- */
function download(name,text,type){var b=new Blob([text],{type:type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
$("csv").onclick=function(){
  var q=function(s){return '"'+String(s==null?"":s).replace(/"/g,'""')+'"'};
  var rows=[["날짜","종료일","기간(일)","시작","종료","일정","의뢰인","장소","투입인원","금액","입금여부","입금기한","메모"]];
  events.slice().sort(function(a,b){return a.date.localeCompare(b.date)||(a.start||"").localeCompare(b.start||"")}).forEach(function(e){rows.push([e.date,e.endDate||"",daysOf(e),e.start,e.end,e.title,e.client,e.place,e.staff,e.amount,e.paid?"입금완료":"미입금",e.due,e.memo])});
  download("blackline_"+today+".csv","\ufeff"+rows.map(function(r){return r.map(q).join(",")}).join("\r\n"),"text/csv;charset=utf-8");
};
$("bak").onclick=function(){download("blackline_backup_"+today+".json",JSON.stringify(events),"application/json")};
$("rst").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result)}catch(x){alert("올바른 백업 파일이 아닙니다.");return}
    if(!Array.isArray(d)){alert("올바른 백업 파일이 아닙니다.");return}
    if(!confirm("서버의 현재 데이터를 백업 파일 내용으로 바꿀까요? (총 "+d.length+"건)"))return;
    seq++;setSync("busy","복원 중…");
    api("/api/restore",{method:"POST",body:{events:d}}).then(function(res){
      events=(res&&res.events)||[];render();
      setSync("ok","복원 완료 "+clock());
      toast("서버에 "+((res&&res.count)||events.length)+"건을 복원했습니다.",true);
    }).catch(function(e){
      setSync("err","복원 실패");
      if(e&&e.status===401)lockNow("세션이 만료되었습니다. 다시 로그인해 주세요.");
      else alert("복원하지 못했습니다.\n"+failMsg(e));
    });
  };
  r.readAsText(f);this.value="";
};

/* ---------- 로그인 입력 ---------- */
$("lb").onclick=doLogin;
$("pin").onkeydown=function(e){if(e.key==="Enter")doLogin()};
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull(false)});
window.addEventListener("focus",function(){pull(false)});
window.addEventListener("online",function(){pull(true)});

render();
boot();
})();
</script>
