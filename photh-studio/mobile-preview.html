<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PHOTH Studio — mobile preview</title>
<style>
  html,body{margin:0;background:#0a0c11;height:100%}
  .wrap{display:flex;justify-content:center;align-items:flex-start;padding:16px}
  iframe{border:0;border-radius:22px;background:#0d0f14;box-shadow:0 20px 60px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="wrap"><iframe id="f" src="./index.html?v=16" width="390" height="844" title="mobile preview"></iframe></div>
<script>
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    const d = f.contentDocument;
    const click = sel => { const el = d.querySelector(sel); if (el) el.click(); };
    setTimeout(() => click('#btnSampleEmpty'), 600);
    setTimeout(() => click('.mnav[data-mnav="retouch"]'), 12000);
    const pickPhoto = (tries) => {
      const el = d.querySelector('.film-item[title="field_portrait.jpg"]');
      if (el) el.click();
      else if (tries > 0) setTimeout(() => pickPhoto(tries - 1), 700);
    };
    setTimeout(() => pickPhoto(6), 6500);
    setTimeout(() => {
      const set = (key, v) => {
        const inp = d.querySelector('.slider[data-key="' + key + '"] input');
        if (!inp) return;
        inp.value = v;
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      };
      set('bokeh', 100); set('bokehLight', 60); set('smooth', 40);
      click('.mnav[data-mnav="retouch"]');
    }, 13500);
  });
</script>
</body>
</html>
