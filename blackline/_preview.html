<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>preview</title>
<style>
  html,body{margin:0;background:#1b1d20;}
  #f{display:block;border:0;background:#0a0b0c;}
</style>
</head>
<body>
<iframe id="f" src="../blackline/" title="preview"></iframe>
<script>
  (function () {
    var f = document.getElementById('f');
    var q = new URLSearchParams(location.search);
    f.style.width = (parseInt(q.get('w') || '375', 10)) + 'px';
    f.style.height = (parseInt(q.get('h') || '812', 10)) + 'px';
    function go() {
      var y = parseInt((location.hash || '#0').slice(1), 10) || 0;
      try { f.contentWindow.scrollTo(0, y); } catch (e) {}
    }
    f.addEventListener('load', function () {
      go(); setTimeout(go, 350); setTimeout(go, 1400);
    });
    window.addEventListener('hashchange', function () { setTimeout(go, 60); });
  })();
</script>
</body>
</html>
